name: Repo purity

# This repo is public. The gate keeps employer, customer, and internal-system
# references out of the tracked tree, file names, and recent commit messages
# on every PR and push. Extend tests/repo-purity.sh when a new term appears.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: No banned references in tree, file names, or recent messages
        run: sh tests/repo-purity.sh
      - name: Certify every skill and attachment dir
        run: |
          set -e
          for d in skills/*/ attachments/*/ attachments/*/*/; do
            [ -f "${d}SKILL.md" ] || continue
            sh tests/certify.sh "$d"
          done

  mcp-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: m4ttstack/rt
          # A sha, never a floating branch: rt main must not be able to turn
          # this repo red without a change here. Moved deliberately, together
          # with any hit fixes, when the pin needs to advance.
          ref: 8123d8c3239821a8c53486fb804dcfa35ab0a5e1
          path: rt
      - uses: oven-sh/setup-bun@v2
      - name: Install rt's dependencies
        run: bun install --frozen-lockfile
        working-directory: rt
      - name: mcp lint (strict)
        run: bun cli.ts skills check --pack-dir "$GITHUB_WORKSPACE" --strict
        working-directory: rt
        env:
          RT_SKIP_SETUP: "1"
          RT_BATCH: "1"
