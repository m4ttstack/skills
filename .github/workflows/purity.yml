name: Repo purity

# This repo is public. The gate keeps employer, customer, and internal-system
# references out of the tracked tree, file names, and recent commit messages
# on every PR and push. Extend tests/repo-purity.sh when a new term appears.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: No banned references in tree, file names, or recent messages
        run: sh tests/repo-purity.sh
      - name: Certify every skill and attachment dir
        run: |
          set -e
          for d in skills/*/ attachments/*/ attachments/*/*/; do
            [ -f "${d}SKILL.md" ] || continue
            sh tests/certify.sh "$d"
          done

  mcp-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: m4ttstack/rt
          # A sha, never a floating branch: rt main must not be able to turn
          # this repo red without a change here. Moved deliberately, together
          # with any hit fixes, when the pin needs to advance.
          ref: 8123d8c3239821a8c53486fb804dcfa35ab0a5e1
          path: rt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: rt/package.json
      - name: Install rt's dependencies
        run: bun install --frozen-lockfile
        working-directory: rt
      # --mattstack-dir names an empty root so rt resolves plugins from it
      # instead of shelling out to `claude plugin list`; the runner has no
      # Claude CLI, and this pack's compiled verbs resolve against itself.
      - name: skills check (compile drift and strict mcp lint)
        run: |
          mkdir -p "$RUNNER_TEMP/mattstack"
          bun cli.ts skills check --pack-dir "$GITHUB_WORKSPACE" --mattstack-dir "$RUNNER_TEMP/mattstack" --strict
        working-directory: rt
        env:
          RT_SKIP_SETUP: "1"
          RT_BATCH: "1"
      - name: Check attachments/mcp-tools/reference.md against the pinned rt
        run: |
          set -o pipefail
          bun cli.ts mcp tools --json | bun "$GITHUB_WORKSPACE/scripts/gen-mcp-tools.ts" | cmp - "$GITHUB_WORKSPACE/attachments/mcp-tools/reference.md" || {
            echo "reference.md is stale against the pinned rt sha. Regenerate with:"
            echo "  rt mcp tools --json | bun scripts/gen-mcp-tools.ts > attachments/mcp-tools/reference.md"
            exit 1
          }
        working-directory: rt
        env:
          RT_SKIP_SETUP: "1"
          RT_BATCH: "1"
